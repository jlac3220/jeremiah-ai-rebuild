name: Visual framework checks
on:
  push:
    branches:
      - feature/media-standards-research
  pull_request:
    paths:
      - 'app/src/core/classroom/**'
      - 'app/src/features/classroom/**'
      - 'app/src/data/curriculum/**'
      - 'app/src/features/ask-jeremiah/**'
      - 'app/server/askJeremiah*.mjs'
      - 'app/server/visualDiscovery*.mjs'
      - 'app/server/narrationHandler.mjs'
      - 'app/scripts/test-*visual*.mjs'
      - 'app/package.json'
      - 'app/src/features/pilot/**'
      - 'app/src/data/og1PilotSurvey.js'
      - 'app/server/pilotFeedbackHandler.mjs'
      - 'app/api/**'
      - 'app/vercel.json'
      - 'app/scripts/test-pilot-feedback.mjs'
      - 'app/scripts/test-vercel-pilot.mjs'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:visual-discovery
      - run: npm run test:visual-framework
      - run: npm run test:biblical-visuals
      - run: npm run test:narration
      - run: npm run test:og1-evidence
      - run: npm run test:og1-climax
      - run: npm run test:og1-exam
      - run: npm run test:og1-rating
      - run: npm run test:og1-theme
      - run: npm run test:og1-journey
      - run: npm run test:og1-inline-bible
      - run: npm run test:grouped
      - run: npm run test:ask-jeremiah
      - run: npm run test:pilot
      - run: npm run test:vercel
      - run: npm run build
