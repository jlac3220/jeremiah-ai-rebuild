name: Jeremiah checks

on:
  push:
    branches:
      - jeremiah-alive-classroom
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/jeremiah-checks.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Jeremiah brain
        run: npm run test:brain

      - name: Validate Bible parser
        run: npm run test:bible

      - name: Validate saved learning dashboard
        run: npm run test:dashboard

      - name: Validate full curriculum
        run: npm run test:curriculum

      - name: Validate teacher-led lesson
        run: npm run test:teacher-led

      - name: Validate grouped lesson coverage and assessment
        run: npm run test:grouped

      - name: Build app
        run: npm run build
